name: Validate itinerary balance branch

on:
  push:
    branches: [itinerary-balance-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate migrated data
        run: pnpm test:data

      - name: Typecheck and build
        run: pnpm build
